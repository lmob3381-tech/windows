name: AI Motion Graphic Render Engine

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  render-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sanitize & Auto-Fix render.js Syntax
        run: |
          node -e '
            const fs = require("fs");
            const bt = "\x60";
            let raw = fs.readFileSync("render.js", "utf8")
              .replace(/\r\n/g, "\n")
              .replace(/^\s*\x60\x60\x60[a-zA-Z]*\s*$/gm, "");
            let lines = raw.split("\n").map(line => {
              if (line.includes("${") && /^\s*[\x27\x60].*[\x27\x60]\s*[;,)\]]*\s*$/.test(line)) {
                return line.replace(/^(\s*)[\x27\x60](.*)[\x27\x60](\s*[;,)\]]*\s*)$/, "$1" + bt + "$2" + bt + "$3");
              }
              return line;
            });
            fs.writeFileSync("render.js", lines.join("\n"), "utf8");
          '

      - name: Auto-Detect Voice & Model Requirements from render.js
        id: detect-voice
        run: |
          NEEDS_VOICE="false"
          SELECTED_MODEL="id_andrew_studio"

          if [ -f "render.js" ]; then
            if grep -qiE "voiceText|translate_tts|VOICE_MODEL|VOICE_ID|edge-tts|elevenlabs|gtts|tts|narasi|speak|voiceover|\.mp3" render.js; then
              NEEDS_VOICE="true"
            fi

            EXPLICIT_MODEL=$(grep -oE "(id_andrew_studio|id_ava_studio|id_brian_narrator|id_emma_story|id_remy_docu|id_vivienne_soft|id_florian_tech|id_seraphina_calm|id_ardi_pro|id_ardi_fast|id_ardi_cinema|id_gadis_natural|id_gadis_ceria|id_gadis_news|eleven_adam|eleven_antoni|eleven_rachel|eleven_bella|eleven_josh|eleven_callum|eleven_charlotte|char_ulasan_tekno|char_mekanik_ahli|char_instruktur|char_dokumenter)" render.js | head -n 1 || true)

            if [ -n "$EXPLICIT_MODEL" ]; then
              SELECTED_MODEL="$EXPLICIT_MODEL"
            elif grep -qiE "perempuan|wanita|cewek|gadis|female|bella|rachel|ava|emma" render.js; then
              SELECTED_MODEL="id_ava_studio"
            elif grep -qiE "mesin|motor|teknik|mekanik|otomotif|piston|silinder" render.js; then
              SELECTED_MODEL="id_andrew_studio"
            elif grep -qiE "dokumenter|sejarah|misteri|cinema|film" render.js; then
              SELECTED_MODEL="id_brian_narrator"
            fi
          fi

          echo "needs_voice=$NEEDS_VOICE" >> $GITHUB_OUTPUT
          echo "selected_model=$SELECTED_MODEL" >> $GITHUB_OUTPUT
          echo "Auto-Detect Result -> needs_voice=$NEEDS_VOICE | selected_model=$SELECTED_MODEL"

      - name: Install Neural Voice Engine (Only When Needed by render.js)
        if: steps.detect-voice.outputs.needs_voice == 'true'
        run: |
          echo "🎙️ Mengaktifkan Engine Suara Neural via PyPI HTTPS (tanpa apt-get)..."
          pip3 install --quiet edge-tts gTTS --break-system-packages || pip3 install --quiet edge-tts gTTS || true

      - name: Cache Node Modules
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            package.json
          key: ${{ runner.os }}-motion-deps-v4

      - name: Install All Motion Graphic JS Requirements
        if: steps.cache-npm.outputs.cache-hit != 'true'
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm init -y
          npm install --legacy-peer-deps \
            @napi-rs/canvas ffmpeg-static \
            three gsap animejs pixi.js lottie-web p5 d3 \
            fabric konva matter-js sharp jimp \
            fluent-ffmpeg @ffmpeg-installer/ffmpeg @ffprobe-installer/ffprobe \
            google-tts-api node-gtts gtts \
            puppeteer playwright
          npm install --legacy-peer-deps canvas || true

      - name: Fast Link Static FFmpeg & FFprobe (Zero apt-get, < 1 sec)
        run: |
          # Langsung gunakan binary statis dari paket NPM agar tidak menyentuh apt-get Ubuntu sama sekali!
          if ! command -v ffmpeg &> /dev/null; then
            FFMPEG_BIN=$(node -e "try { console.log(require('ffmpeg-static') || require('@ffmpeg-installer/ffmpeg').path); } catch(e) {}" 2>/dev/null || true)
            if [ -n "$FFMPEG_BIN" ] && [ -f "$FFMPEG_BIN" ]; then
              sudo chmod +x "$FFMPEG_BIN"
              sudo ln -sf "$FFMPEG_BIN" /usr/local/bin/ffmpeg
              echo "⚡ Berhasil menautkan ffmpeg statis ke /usr/local/bin/ffmpeg!"
            fi
          fi
          if ! command -v ffprobe &> /dev/null; then
            FFPROBE_BIN=$(node -e "try { console.log(require('@ffprobe-installer/ffprobe').path); } catch(e) {}" 2>/dev/null || true)
            if [ -n "$FFPROBE_BIN" ] && [ -f "$FFPROBE_BIN" ]; then
              sudo chmod +x "$FFPROBE_BIN"
              sudo ln -sf "$FFPROBE_BIN" /usr/local/bin/ffprobe
              echo "⚡ Berhasil menautkan ffprobe statis ke /usr/local/bin/ffprobe!"
            fi
          fi
          ffmpeg -version | head -n 1 || true
          ffprobe -version | head -n 1 || true

      - name: Auto-Detect & Install Extra Requirements from render.js
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          if [ -f "render.js" ]; then
            EXTRAS=$(node -e '
              const fs = require("fs");
              const builtin = require("module").builtinModules;
              const code = fs.readFileSync("render.js", "utf8");
              const pkgs = new Set();
              const re = /(?:require\s*\(\s*|from\s+)["\x27]([^"\x27]+)["\x27]/g;
              let m;
              while ((m = re.exec(code)) !== null) {
                const p = m[1];
                if (!p.startsWith(".") && !p.startsWith("/")) {
                  const parts = p.split("/");
                  const name = p.startsWith("@") ? parts.slice(0, 2).join("/") : parts[0];
                  if (!builtin.includes(name) && !builtin.includes(name.replace(/^node:/, ""))) {
                    pkgs.add(name);
                  }
                }
              }
              console.log(Array.from(pkgs).join(" "));
            ' || true)
            for pkg in $EXTRAS; do
              if [ ! -d "node_modules/$pkg" ]; then
                npm install "$pkg" --legacy-peer-deps || true
              fi
            done
          fi

      - name: Prepare Stock Voice Models & Compatibility Layer
        env:
          NEEDS_VOICE: ${{ steps.detect-voice.outputs.needs_voice }}
          DEFAULT_VOICE_MODEL: ${{ steps.detect-voice.outputs.selected_model }}
        run: |
          cat << 'PRELOAD_EOF' > preload_fix.js
          const Module = require('module');
          const child_process = require('child_process');
          const { execFileSync } = child_process;
          const https = require('https');
          const fs = require('fs');

          const origLoad = Module._load;
          Module._load = function(request, parent, isMain) {
            if (request === 'canvas') {
              try {
                return origLoad.apply(this, arguments);
              } catch (e) {
                return origLoad.call(this, '@napi-rs/canvas', parent, isMain);
              }
            }
            return origLoad.apply(this, arguments);
          };

          const origSpawn = child_process.spawn;
          child_process.spawn = function(command, args, options) {
            if (Array.isArray(args) && String(command).toLowerCase().includes('ffmpeg')) {
              args = args.filter(arg => arg !== '-shortest');
            }
            const proc = origSpawn.call(this, command, args, options);
            if (proc && proc.stdin) {
              proc.stdin.on('error', (err) => {
                if (err && (err.code === 'EPIPE' || err.code === 'ERR_STREAM_DESTROYED' || err.code === 'EOF')) {
                  return;
                }
              });
              const origWrite = proc.stdin.write.bind(proc.stdin);
              proc.stdin.write = function(chunk, encoding, cb) {
                if (!proc.stdin.writable || proc.stdin.destroyed || proc.killed || proc.exitCode !== null) {
                  if (typeof encoding === 'function') encoding();
                  else if (typeof cb === 'function') cb();
                  return false;
                }
                try {
                  return origWrite(chunk, encoding, cb);
                } catch (e) {
                  return false;
                }
              };
            }
            return proc;
          };

          try {
            const napiCanvas = require('@napi-rs/canvas');
            const origCreateCanvas = napiCanvas.createCanvas;
            napiCanvas.createCanvas = function(w, h) {
              const c = origCreateCanvas(w, h);
              const ctx = c.getContext('2d');
              c.data = function() {
                const imgData = ctx.getImageData(0, 0, w, h);
                return Buffer.from(imgData.data.buffer, imgData.data.byteOffset, imgData.data.byteLength);
              };
              return c;
            };
          } catch (e) {}

          const VOICE_STOCK_MODELS = {
            id_andrew_studio:   { voice: 'en-US-AndrewMultilingualNeural',   pitch: '+0Hz', rate: '+4%',  preset: 'studio_warm' },
            id_ava_studio:      { voice: 'en-US-AvaMultilingualNeural',      pitch: '+0Hz', rate: '+2%',  preset: 'studio_crisp' },
            id_brian_narrator:  { voice: 'en-US-BrianMultilingualNeural',    pitch: '-2Hz', rate: '+3%',  preset: 'cinema_deep' },
            id_emma_story:      { voice: 'en-US-EmmaMultilingualNeural',     pitch: '+1Hz', rate: '+2%',  preset: 'studio_crisp' },
            id_remy_docu:       { voice: 'fr-FR-RemyMultilingualNeural',     pitch: '-1Hz', rate: '+3%',  preset: 'studio_warm' },
            id_vivienne_soft:   { voice: 'fr-FR-VivienneMultilingualNeural', pitch: '+0Hz', rate: '+0%',  preset: 'studio_crisp' },
            id_florian_tech:    { voice: 'de-DE-FlorianMultilingualNeural',  pitch: '-1Hz', rate: '+5%',  preset: 'cinema_deep' },
            id_seraphina_calm:  { voice: 'de-DE-SeraphinaMultilingualNeural',pitch: '+0Hz', rate: '+0%',  preset: 'studio_crisp' },
            id_ardi_pro:        { voice: 'id-ID-ArdiNeural',                 pitch: '-1Hz', rate: '+5%',  preset: 'studio_warm' },
            id_ardi_fast:       { voice: 'id-ID-ArdiNeural',                 pitch: '+0Hz', rate: '+14%', preset: 'studio_crisp' },
            id_ardi_cinema:     { voice: 'id-ID-ArdiNeural',                 pitch: '-4Hz', rate: '-2%',  preset: 'cinema_deep' },
            id_gadis_natural:   { voice: 'id-ID-GadisNeural',                pitch: '+0Hz', rate: '+4%',  preset: 'studio_crisp' },
            id_gadis_ceria:     { voice: 'id-ID-GadisNeural',                pitch: '+3Hz', rate: '+10%', preset: 'studio_crisp' },
            id_gadis_news:      { voice: 'id-ID-GadisNeural',                pitch: '-1Hz', rate: '+6%',  preset: 'studio_warm' },
            eleven_adam:        { voice: 'en-US-ChristopherNeural',          pitch: '-3Hz', rate: '+2%',  preset: 'cinema_deep' },
            eleven_antoni:      { voice: 'en-US-EricNeural',                 pitch: '-1Hz', rate: '+4%',  preset: 'studio_warm' },
            eleven_rachel:      { voice: 'en-US-AriaNeural',                 pitch: '+0Hz', rate: '+2%',  preset: 'studio_crisp' },
            eleven_bella:       { voice: 'en-US-JennyNeural',                pitch: '+1Hz', rate: '+0%',  preset: 'studio_crisp' },
            eleven_josh:        { voice: 'en-US-GuyNeural',                  pitch: '-2Hz', rate: '+3%',  preset: 'studio_warm' },
            eleven_callum:      { voice: 'en-GB-RyanNeural',                 pitch: '-2Hz', rate: '+2%',  preset: 'cinema_deep' },
            eleven_charlotte:   { voice: 'en-GB-SoniaNeural',                pitch: '+0Hz', rate: '+2%',  preset: 'studio_crisp' },
            char_ulasan_tekno:  { voice: 'en-US-AndrewMultilingualNeural',   pitch: '-1Hz', rate: '+8%',  preset: 'studio_warm' },
            char_mekanik_ahli:  { voice: 'id-ID-ArdiNeural',                 pitch: '-2Hz', rate: '+4%',  preset: 'cinema_deep' },
            char_instruktur:    { voice: 'id-ID-GadisNeural',                pitch: '+0Hz', rate: '+5%',  preset: 'studio_warm' },
            char_dokumenter:    { voice: 'en-US-BrianMultilingualNeural',    pitch: '-3Hz', rate: '+0%',  preset: 'cinema_deep' }
          };

          const AUDIO_MASTERING_FILTERS = {
            studio_warm:  'highpass=f=75,equalizer=f=180:width_type=o:width=1.2:g=2.5,equalizer=f=3500:width_type=o:width=1.5:g=2.0,acompressor=threshold=-18dB:ratio=3:attack=15:release=150:makeup=2dB,alimiter=limit=0.95',
            studio_crisp: 'highpass=f=85,equalizer=f=220:width_type=o:width=1.2:g=1.5,equalizer=f=4500:width_type=o:width=1.5:g=3.0,acompressor=threshold=-16dB:ratio=2.8:attack=10:release=120:makeup=2dB,alimiter=limit=0.95',
            cinema_deep:  'highpass=f=60,equalizer=f=130:width_type=o:width=1.0:g=4.0,equalizer=f=3200:width_type=o:width=1.5:g=2.2,acompressor=threshold=-20dB:ratio=3.5:attack=12:release=180:makeup=3dB,alimiter=limit=0.95'
          };

          global.VOICE_STOCK_MODELS = VOICE_STOCK_MODELS;

          function synthesizeStudioVoice(text, outputMp3Path, requestedModelKey) {
            const activeKey = requestedModelKey || process.env.VOICE_MODEL || process.env.DEFAULT_VOICE_MODEL || 'id_andrew_studio';
            const cfg = VOICE_STOCK_MODELS[activeKey] || VOICE_STOCK_MODELS['id_andrew_studio'];
            const rawMp3 = '/tmp/raw_tts_' + Date.now() + '_' + Math.random().toString(36).slice(2) + '.mp3';
            let success = false;

            const candidates = [cfg, VOICE_STOCK_MODELS['id_ardi_pro'], VOICE_STOCK_MODELS['id_gadis_natural']];
            for (const cand of candidates) {
              try {
                execFileSync('edge-tts', [
                  '--voice', cand.voice,
                  '--pitch=' + cand.pitch,
                  '--rate=' + cand.rate,
                  '--text', String(text),
                  '--write-media', rawMp3
                ], { stdio: 'ignore', timeout: 20000 });
                if (fs.existsSync(rawMp3) && fs.statSync(rawMp3).size > 200) {
                  const af = AUDIO_MASTERING_FILTERS[cand.preset] || AUDIO_MASTERING_FILTERS.studio_warm;
                  execFileSync('ffmpeg', [
                    '-y', '-i', rawMp3,
                    '-af', af,
                    '-ar', '44100', '-ac', '2', '-b:a', '192k',
                    outputMp3Path
                  ], { stdio: 'ignore' });
                  fs.unlinkSync(rawMp3);
                  success = true;
                  break;
                }
              } catch (err) {}
            }

            if (!success) {
              try {
                execFileSync('gtts-cli', ['-l', 'id', String(text), '--output', rawMp3], { stdio: 'ignore' });
                const af = AUDIO_MASTERING_FILTERS.studio_warm;
                execFileSync('ffmpeg', [
                  '-y', '-i', rawMp3,
                  '-af', 'atempo=1.15,' + af,
                  '-ar', '44100', '-ac', '2', '-b:a', '192k',
                  outputMp3Path
                ], { stdio: 'ignore' });
                if (fs.existsSync(rawMp3)) fs.unlinkSync(rawMp3);
                success = true;
              } catch (e2) {
                execFileSync('ffmpeg', [
                  '-y', '-f', 'lavfi', '-i', 'anullsrc=r=44100:cl=stereo',
                  '-t', '3', '-q:a', '9', '-acodec', 'libmp3lame',
                  outputMp3Path
                ], { stdio: 'ignore' });
              }
            }
            return outputMp3Path;
          }

          global.generateStudioVoice = synthesizeStudioVoice;

          if (process.env.NEEDS_VOICE === 'true') {
            const origGet = https.get;
            https.get = function(url, options, cb) {
              if (typeof options === 'function') {
                cb = options;
                options = {};
              }
              const urlStr = typeof url === 'string' ? url : (url && url.href ? url.href : '');
              if (urlStr.includes('https://translate.google.com/translate_tts') || urlStr.includes('tts://')) {
                try {
                  const parsed = new URL(urlStr.replace('tts://', 'https://tts.local/?'));
                  const text = parsed.searchParams.get('q') || parsed.searchParams.get('text') || 'Narasi video';
                  const modelParam = parsed.searchParams.get('model') || parsed.searchParams.get('voice') || process.env.DEFAULT_VOICE_MODEL;
                  const tmpMp3 = '/tmp/studio_tts_' + Date.now() + '_' + Math.random().toString(36).slice(2) + '.mp3';

                  synthesizeStudioVoice(text, tmpMp3, modelParam);

                  const stream = fs.createReadStream(tmpMp3);
                  stream.statusCode = 200;
                  stream.headers = { 'content-type': 'audio/mpeg' };
                  stream.on('close', () => {
                    try { fs.unlinkSync(tmpMp3); } catch (e) {}
                  });
                  if (cb) process.nextTick(() => cb(stream));
                  return { on: () => ({ on: () => {} }), end: () => {} };
                } catch (err) {}
              }
              return origGet.apply(https, arguments);
            };
          }
          PRELOAD_EOF

          if [ "$NEEDS_VOICE" == "true" ] && [ -f "render.js" ]; then
            sed -i 's/atempo=1.18/atempo=1.02/g' render.js || true
          fi

      - name: Run JS Motion Graphic Render
        env:
          NEEDS_VOICE: ${{ steps.detect-voice.outputs.needs_voice }}
          DEFAULT_VOICE_MODEL: ${{ steps.detect-voice.outputs.selected_model }}
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" node --require ./preload_fix.js render.js

      - name: Upload Rendered Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-motion-graphic
          path: |
            *.mp4
            *.webm
            *.gif
            output/*
          if-no-files-found: error
          retention-days: 3
