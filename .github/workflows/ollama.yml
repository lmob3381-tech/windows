name: Run Ollama 7B with Cloudflare Tunnel

# ============================================================
# CATATAN PENTING:
# - GitHub Actions runner cuma nyala sementara (max 6 jam per run di free tier).
# - Workflow ini dijadwalkan nyala tiap hari, jalan selama durasi tertentu (default 3 jam),
#   lalu otomatis mati.
# - URL Cloudflare Tunnel yang dihasilkan (mode "quick tunnel") BERUBAH setiap run,
#   karena bukan tunnel permanen dengan domain sendiri. Cek log run untuk lihat URL-nya.
# - Cocok untuk testing/demo pribadi, BUKAN untuk hosting production/24-7.
# ============================================================

on:
  # Jadwal cron: contoh ini nyala tiap hari jam 09:00 UTC (16:00 WIB)
  # Ubah sesuai kebutuhan: https://crontab.guru
  schedule:
    - cron: "0 9 * * *"

  # Bisa juga dipicu manual dari tab Actions di GitHub
  workflow_dispatch:
    inputs:
      model:
        description: "Model Ollama yang mau dijalankan"
        required: false
        default: "llama2:7b"
        type: string
      duration_minutes:
        description: "Berapa lama server nyala (menit, max ~355 karena batas runner 6 jam)"
        required: false
        default: "355"
        type: string

jobs:
  run-ollama:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # hard limit GitHub Actions (6 jam), sesuaikan jika perlu lebih pendek

    env:
      OLLAMA_MODEL: ${{ inputs.model || 'llama2:7b' }}
      DURATION_MINUTES: ${{ inputs.duration_minutes || '355' }}

    steps:
      - name: Checkout repo (opsional, kalau ada config/rules custom)
        uses: actions/checkout@v4

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server (background)
        env:
          # Wajib, kalau tidak diset Ollama menolak (403) request yang Host header-nya
          # bukan localhost/127.0.0.1 — dan domain trycloudflare.com pasti kena ini.
          OLLAMA_HOST: "0.0.0.0:11434"
          OLLAMA_ORIGINS: "*"
        run: |
          nohup env OLLAMA_HOST="$OLLAMA_HOST" OLLAMA_ORIGINS="$OLLAMA_ORIGINS" ollama serve > ollama.log 2>&1 &
          echo "Menunggu Ollama server siap..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:11434 > /dev/null; then
              echo "Ollama server siap!"
              break
            fi
            sleep 2
          done

      - name: Pull model ${{ env.OLLAMA_MODEL }}
        run: |
          ollama pull "${OLLAMA_MODEL}"

      - name: Terapkan aturan/system prompt custom (dari rules/rules.txt)
        # File rules/rules.txt cukup berisi TEKS ATURAN POLOS (bukan format Modelfile).
        # Contoh isi rules/rules.txt:
        #   Kamu adalah asisten yang santai dan gaul. Selalu jawab pakai bahasa Indonesia.
        #   Jangan pernah membahas topik X. Selalu akhiri jawaban dengan emoji.
        # File ini yang akan diedit lewat web admin.
        run: |
          mkdir -p rules
          if [ -f rules/rules.txt ] && [ -s rules/rules.txt ]; then
            echo "Aturan custom ditemukan, build model custom..."
            {
              echo "FROM ${OLLAMA_MODEL}"
              echo "SYSTEM \"\"\""
              cat rules/rules.txt
              echo "\"\"\""
            } > rules/Modelfile.generated

            ollama create custom-model -f rules/Modelfile.generated
            echo "OLLAMA_MODEL=custom-model" >> "$GITHUB_ENV"
            echo "Model custom 'custom-model' berhasil dibuat dengan aturan dari rules/rules.txt"
          else
            echo "Tidak ada rules/rules.txt, pakai model default tanpa aturan tambahan."
          fi

      - name: Install cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Start Cloudflare Quick Tunnel
        run: |
          nohup cloudflared tunnel --url http://localhost:11434 > cloudflared.log 2>&1 &
          echo "Menunggu tunnel siap..."
          sleep 10
          echo "=== URL TUNNEL PUBLIK ANDA ==="
          grep -o "https://[a-zA-Z0-9.-]*\.trycloudflare\.com" cloudflared.log | head -1 || echo "URL belum muncul, cek cloudflared.log"
          echo "==============================="
          cat cloudflared.log

      - name: Tampilkan info akses
        run: |
          echo "Ollama model: ${OLLAMA_MODEL}"
          echo "Server akan tetap nyala selama ${DURATION_MINUTES} menit."
          echo "Gunakan URL trycloudflare.com di atas untuk akses via API:"
          echo "curl https://<url-tunnel>/api/generate -d '{\"model\":\"'${OLLAMA_MODEL}'\",\"prompt\":\"Halo\"}'"

      - name: Jaga server tetap nyala selama durasi yang ditentukan
        run: |
          sleep $((DURATION_MINUTES * 60))
          echo "Waktu habis, server akan dimatikan."

      - name: Upload log (untuk debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            ollama.log
            cloudflared.log
            
