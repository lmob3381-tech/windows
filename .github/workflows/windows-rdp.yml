name: Windows Remote Desktop (RDP via Tailscale)

on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: 'Password buat login RDP (min 8 karakter, ada huruf besar/kecil/angka)'
        required: true
        default: 'Asukabehko123@'
      sunshine_password:
        description: 'Password buat login web admin Sunshine (port 47990)'
        required: true
        default: 'Ngewesamaputri123@'

jobs:
  windows-rdp:
    runs-on: windows-2022
    timeout-minutes: 350   # ~6 jam, batas maksimal GitHub-hosted runner

    steps:
      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          $maxRetries = 5
          $success = $false
          for ($i = 1; $i -le $maxRetries; $i++) {
            try {
              Write-Host "Percobaan download ke-$i..."
              Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe" -UseBasicParsing -TimeoutSec 60
              $success = $true
              break
            } catch {
              Write-Host "Gagal: $($_.Exception.Message)"
              Start-Sleep -Seconds 10
            }
          }

          if (-not $success) {
            Write-Host "GAGAL total download Tailscale setelah $maxRetries percobaan."
            exit 1
          }

          Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/quiet" -Wait
          Start-Sleep -Seconds 5
          Write-Host "Tailscale terinstall."

      - name: Connect ke Tailnet
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"

          & $tailscaleExe up --authkey="tskey-auth-kZG3kY3t5211CNTRL-LtjttLtxggVnz3K17iWggVd3fPk8ERUG" --accept-dns --hostname="github-runner-$env:GITHUB_RUN_ID" --unattended

          Start-Sleep -Seconds 5

          $status = & $tailscaleExe status --json | ConvertFrom-Json
          $tsIP = $status.Self.TailscaleIPs[0]

          if (-not $tsIP) {
            Write-Host "GAGAL: Tailscale belum dapat IP. Cek status:"
            & $tailscaleExe status
            exit 1
          }

          Write-Host "Tailscale IP: $tsIP"
          echo "TS_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Enable RDP + set password
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          $password = ConvertTo-SecureString "${{ github.event.inputs.rdp_password }}" -AsPlainText -Force

          Write-Host "Daftar local user yang ada:"
          Get-LocalUser | Select-Object Name, Enabled | Format-Table | Out-String | Write-Host

          $candidates = @("runneradmin", "runner", $env:USERNAME)
          $user = $null

          foreach ($c in $candidates) {
            if ($c -and (Get-LocalUser -Name $c -ErrorAction SilentlyContinue)) {
              $user = $c
              break
            }
          }

          if (-not $user) {
            $adminGroup = Get-LocalGroupMember -Group "Administrators" -ErrorAction SilentlyContinue
            if ($adminGroup) {
              $user = ($adminGroup | Select-Object -First 1).Name -replace '^.*\\', ''
            }
          }

          if (-not $user) {
            Write-Host "GAGAL: Tidak ada user admin lokal yang ditemukan."
            exit 1
          }

          Set-LocalUser -Name $user -Password $password
          Add-LocalGroupMember -Group "Administrators" -Member $user -ErrorAction SilentlyContinue

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -ErrorAction SilentlyContinue

          Write-Host "RDP enabled. User: $user"
          echo "RDP_USER=$user" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install DirectX 9 (redist)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          Write-Host "Download DirectX End-User Runtime Web Installer..."
          Invoke-WebRequest -Uri "https://download.microsoft.com/download/1/7/1/1718CCC4-6315-4D8E-9543-8E28A4E18C4C/dxwebsetup.exe" -OutFile "dxwebsetup.exe" -UseBasicParsing

          Start-Process -FilePath ".\dxwebsetup.exe" -ArgumentList "/Q" -Wait
          Write-Host "DirectX End-User Runtime terinstall (ini yang nyediain d3dx9_xx.dll dkk buat game lama kaya GTA SA)."

          # DirectX 9.0c runtime lengkap (offline redist), buat jaga-jaga kalau web installer kurang lengkap
          Write-Host "Download DirectX 9.0c redist (offline, lebih lengkap utk game lama)..."
          Invoke-WebRequest -Uri "https://download.microsoft.com/download/8/4/A/84A35BF1-DAFE-4AE8-82AF-AD2AE20B6B14/directx_Jun2010_redist.exe" -OutFile "dx_redist.exe" -UseBasicParsing
          New-Item -ItemType Directory -Path "C:\dxredist" -Force | Out-Null
          Start-Process -FilePath ".\dx_redist.exe" -ArgumentList "/Q", "/T:C:\dxredist", "/C" -Wait

          Get-ChildItem "C:\dxredist" -Filter "*.exe" | ForEach-Object {
            Start-Process -FilePath $_.FullName -ArgumentList "/Q" -Wait -ErrorAction SilentlyContinue
          }

          Write-Host "DirectX 9 runtime + redist selesai."

      - name: Install virtual sound card (VB-Audio Virtual Cable)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          # GitHub-hosted Windows runner nggak punya sound card fisik.
          # GTA SA (dan game lawas lain) sering crash/hang kalau nggak nemu audio device sama sekali,
          # jadi kita pasang virtual audio cable biar Windows selalu punya minimal 1 output device.
          Write-Host "Download VB-Audio Virtual Cable..."
          Invoke-WebRequest -Uri "https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack43.zip" -OutFile "vbcable.zip" -UseBasicParsing

          Expand-Archive -Path "vbcable.zip" -DestinationPath "C:\vbcable" -Force

          $setupExe = Get-ChildItem "C:\vbcable" -Filter "VBCABLE_Setup_x64.exe" -Recurse | Select-Object -First 1
          if (-not $setupExe) {
            $setupExe = Get-ChildItem "C:\vbcable" -Filter "*.exe" -Recurse | Select-Object -First 1
          }

          Start-Process -FilePath $setupExe.FullName -ArgumentList "-i", "-h" -Wait

          Write-Host "Restart audio service biar device baru kedetect..."
          Restart-Service -Name "Audiosrv" -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

          Write-Host "Audio device yang kedetect sekarang:"
          Get-CimInstance -ClassName Win32_SoundDevice | Select-Object Name, Status | Format-Table | Out-String | Write-Host

      - name: Install Sunshine (streaming server)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          Write-Host "Ambil link installer Sunshine terbaru dari GitHub releases..."
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/LizardByte/Sunshine/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "*windows*installer*.exe" } | Select-Object -First 1

          if (-not $asset) {
            Write-Host "GAGAL: Installer Sunshine untuk Windows tidak ditemukan di release terbaru."
            exit 1
          }

          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "sunshine-setup.exe" -UseBasicParsing
          Start-Process -FilePath ".\sunshine-setup.exe" -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 5

          Enable-NetFirewallRule -DisplayGroup "*Sunshine*" -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "Sunshine Web UI" -Direction Inbound -Protocol TCP -LocalPort 47990 -Action Allow -ErrorAction SilentlyContinue

          Write-Host "Sunshine terinstall. Web admin UI ada di port 47990."
          Write-Host "Username/password admin Sunshine di-set manual di step berikutnya lewat web UI pertama kali login,"
          Write-Host "karena Sunshine generate credential lewat halaman setup awal, bukan lewat CLI/registry."

      - name: Tampilkan info koneksi + keep alive
        shell: powershell
        run: |
          Write-Host "=================================================="
          Write-Host " KONEKSI SIAP"
          Write-Host "=================================================="
          Write-Host " RDP (buat setup awal / install game):"
          Write-Host "   Host/IP   : $env:TS_IP"
          Write-Host "   Port      : 3389"
          Write-Host "   Username  : $env:RDP_USER"
          Write-Host "   Password  : ${{ github.event.inputs.rdp_password }}"
          Write-Host ""
          Write-Host " Sunshine (buat streaming game via Moonlight):"
          Write-Host "   Web admin : https://$($env:TS_IP):47990"
          Write-Host "   (buka via browser di device yang login Tailscale sama,"
          Write-Host "    set username/password admin di halaman itu pertama kali buka)"
          Write-Host "=================================================="
          Write-Host ""
          Write-Host "Jangan cancel workflow ini selama masih dipakai."
          Write-Host ""

          $endTime = (Get-Date).AddMinutes(335)
          while ((Get-Date) -lt $endTime) {
            Start-Sleep -Seconds 30
            $tsState = & "C:\Program Files\Tailscale\tailscale.exe" status --json | ConvertFrom-Json
            if (-not $tsState.Self.Online) {
              Write-Host "PERINGATAN: Tailscale terputus."
              break
            }
            Write-Host "Masih hidup... $(Get-Date) | Tailscale IP: $env:TS_IP"
          }

      - name: Logout Tailscale (cleanup)
        if: always()
        shell: powershell
        run: |
          $tsPath = "C:\Program Files\Tailscale\tailscale.exe"
          if (Test-Path $tsPath) {
            & $tsPath logout
          } else {
            Write-Host "Tailscale tidak terinstall, skip logout."
          }
