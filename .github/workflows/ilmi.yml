name: Ubuntu 22.04 SSH via Tailscale

on:
  workflow_dispatch:

jobs:
  run-ubuntu-ssh:
    runs-on: ubuntu-22.04
    steps:
      - name: Install & Run Tailscale Native
        env:
          # Ganti nilai ini dengan Tailscale Auth Key Anda yang sebenarnya
          TAILSCALE_AUTHKEY: "tskey-auth-kZG3kY3t5211CNTRL-LtjttLtxggVnz3K17iWggVd3fPk8ERUG"
        run: |
          # Install Tailscale langsung ke dalam sistem Ubuntu
          curl -fsSL https://tailscale.com/install.sh | sh
          
          # Menjalankan layanan Tailscale dan login menggunakan Auth Key
          sudo tailscale up --authkey="${TAILSCALE_AUTHKEY}" --hostname="ubuntu-github-runner"

      - name: Setup SSH & Password (root:ilmi1234)
        run: |
          # Set password untuk root
          echo "root:ilmi1234" | sudo chpasswd
          
          # Konfigurasi SSH agar mengizinkan login root dengan password
          sudo sed -i 's/^#*PermitRootLogin .*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*PasswordAuthentication .*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*KbdInteractiveAuthentication .*/KbdInteractiveAuthentication yes/' /etc/ssh/sshd_config
          
          # Hapus file konfigurasi cloud-init yang mungkin menimpa setingan password
          sudo rm -f /etc/ssh/sshd_config.d/*.conf
          
          # Restart layanan SSH
          sudo systemctl restart ssh

      - name: Install Antigravity CLI
        run: |
          # Install Antigravity CLI tanpa Snap
          curl -fsSL https://antigravity.google/cli/install.sh | bash

          # Pastikan CLI masuk PATH
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          # Verifikasi instalasi
          agy --version

          echo "✅ Antigravity CLI installed"

      - name: Install Hermes Agent
        env:
          GOOGLE_API_KEY: "AQ.Ab8RN6KOOQqKljEGzufWM-m_kQWEIyRETKr0UdyjMZVg74_tOQ"
        run: |
          # Install Hermes Agent
          curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh | bash

          # Simpan API key ke environment shell
          echo "export GOOGLE_API_KEY='$GOOGLE_API_KEY'" >> ~/.bashrc
          export GOOGLE_API_KEY="$GOOGLE_API_KEY"

          echo "✅ Hermes Agent installed"
          echo "✅ Google AI Studio API key configured"

      - name: Tampilkan Info & Keep Alive
        run: |
          echo "========================================================="
          echo "✅ Instance Ubuntu 22.04 siap digunakan!"
          echo "✅ Tailscale berjalan secara native di dalam Ubuntu."
          echo "✅ Antigravity CLI terinstall."
          echo "✅ Hermes Agent terinstall."
          echo "✅ Google AI Studio API key sudah dikonfigurasi."
          echo ""
          echo "💻 Cara konek:"
          echo "   1. Buka dashboard Tailscale, cari device dengan nama 'ubuntu-github-runner'"
          echo "   2. Jalankan di terminal Anda: ssh root@<IP_TAILSCALE>"
          echo "   3. Masukkan password: ilmi1234"
          echo "   4. Jalankan Hermes dengan: hermes"
          echo "========================================================="
          
          # Sleep infinity agar workflow tetap berjalan
          sleep infinity
